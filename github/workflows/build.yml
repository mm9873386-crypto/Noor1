name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip highest-numbered noor-app zip
        run: |
          ZIP=$(ls noor-app-v*.zip | sort -V | tail -1)
          echo "Building from $ZIP"
          mkdir work
          unzip -q "$ZIP" -d work
          echo "PROJECT=$(pwd)/work/noor-app" >> $GITHUB_ENV

      - name: Install and add Android platform
        working-directory: ${{ env.PROJECT }}
        run: |
          npm install
          npx cap add android

      - name: Patch (sounds, permissions, adhan service)
        working-directory: ${{ env.PROJECT }}
        run: node patch.js

      - name: Sync web assets and plugins
        working-directory: ${{ env.PROJECT }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: ${{ env.PROJECT }}/android/app/build/outputs/apk/debug/*.apk
